name: Write PM Requirements with Warp Agent

on:
  issues:
    types: [labeled]

jobs:
  auto-fix:
    if: github.event.label.name == 'warp-pm-requirements' 
    runs-on: ubuntu-latest
    permissions:
      issues: write

    env:
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Generate prompt
        run: envsubst < agents/pm-requirements.md

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Warp Agent to fix issue
        uses: warpdotdev/warp-agent-action@main
        with:
          warp_api_key: ${{ secrets.WARP_API_KEY }}
          prompt: ${{ steps.generate-prompt.outputs.result }}
