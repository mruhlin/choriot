name: Write PM Requirements with Warp Agent

on:
  issues:
    types: [labeled]

jobs:
  requirements:
    if: github.event.label.name == 'warp-pm-requirements' 
    runs-on: ubuntu-latest
    permissions:
      issues: write

    env:
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate prompt
        id: generate-prompt
        run: |
          DELIMITER="$(openssl rand -hex 16)"
          {
            echo "prompt<<${DELIMITER}"
            envsubst < agents/pm-requirements.md
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"

      - name: Let warp agent write PM requirements
        uses: warpdotdev/warp-agent-action@main
        with:
          warp_api_key: ${{ secrets.WARP_API_KEY }}
          prompt: ${{ steps.generate-prompt.outputs.prompt }}
