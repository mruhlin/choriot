name: Write PM Requirements with Warp Agent

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  requirements:
    if: |
      (
        (github.event_name == 'issues' && github.event.label.name == 'warp-pm-requirements') ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body,'@warp-pm-requirements'))
      ) &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    env:
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}

    steps:
      - name: Post workflow started comment
        uses: actions/github-script@v7
        id: status-comment
        with:
          script: |
            const comment = await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🔄 Warp PM Requirements workflow started - [View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            });
            return comment.data.id;

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate prompt
        id: generate-prompt
        run: |
          DELIMITER="$(openssl rand -hex 16)"
          echo "prompt<<${DELIMITER}" >> "$GITHUB_OUTPUT"
          envsubst < agents/pm-requirements.md >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "${DELIMITER}" >> "$GITHUB_OUTPUT"

      - name: Let warp agent write PM requirements
        uses: warpdotdev/warp-agent-action@main
        with:
          warp_api_key: ${{ secrets.WARP_API_KEY }}
          prompt: ${{ steps.generate-prompt.outputs.prompt }}

      - name: Update status comment on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ steps.status-comment.outputs.result }},
              body: `✅ Warp PM Requirements workflow completed successfully - [View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            });

      - name: Update status comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ steps.status-comment.outputs.result }},
              body: `❌ Warp PM Requirements workflow failed - [View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            });
